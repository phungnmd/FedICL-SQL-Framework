<svg xmlns="http://www.w3.org/2000/svg" width="468" height="208" viewBox="0 0 468 208" role="img" aria-labelledby="fig-template-title fig-template-desc">
  <title id="fig-template-title">Figure style sheet</title>
  <desc id="fig-template-desc">The surfaces, cards, chips, marks, icons, connectors and text styles every diagram of the paper is built from.</desc>

  <!-- Copy this style block and the defs into every figure, unchanged. -->
  <style>
    text { font-family: Arial, Helvetica, sans-serif; font-size: 8px; fill: #000; }
    .h { font-size: 9px; font-weight: bold; }
    .b { font-weight: bold; }
    .i { font-style: italic; }
    .sub { font-size: 6px; }
    .mid { text-anchor: middle; }
    .end { text-anchor: end; }
    .blue { fill: #E8F0FE; stroke: #2563EB; stroke-width: 0.75; }
    .method { fill: #F8EAF2; stroke: #A8528A; stroke-width: 0.75; }
    .plain { fill: #F1F5F9; stroke: #94A3B8; stroke-width: 0.5; }
    .client { fill: #FFF7E6; }
    .boundary { fill: none; stroke: #B45309; stroke-width: 0.75; stroke-dasharray: 3 2; }
    .card { fill: #FFFFFF; }
    .card-band { fill: #F1F5F9; }
    .card-line { fill: none; stroke: #94A3B8; stroke-width: 0.75; }
    .card-badge { fill: #EFD3E3; }
    .rule { fill: none; stroke: #CBD5E1; stroke-width: 0.5; }
    .chip { fill: #FFFFFF; stroke: #94A3B8; stroke-width: 0.5; }
    .chip-blue { fill: #FFFFFF; stroke: #2563EB; stroke-width: 0.5; }
    .chip-method { fill: #F8EAF2; stroke: #A8528A; stroke-width: 0.5; }
    .chip-ok { fill: #DDF3EB; stroke: #009E73; stroke-width: 0.5; }
    .chip-bad { fill: #FBE5D8; stroke: #D55E00; stroke-width: 0.5; }
    .flow { fill: none; stroke: #334155; stroke-width: 0.75; marker-end: url(#arrow); }
    .comm { fill: none; stroke: #2563EB; stroke-width: 1.25; marker-end: url(#arrow-comm); }
    .ic { stroke-width: 1; stroke-linecap: round; stroke-linejoin: round; }
    .ic-blue { stroke: #1D4ED8; fill: #C9DCFC; }
    .ic-method { stroke: #8E3F74; fill: #EFD3E3; }
    .ic-slate { stroke: #475569; fill: #E2E8F0; }
    .ic-amber { stroke: #B45309; fill: #FBDFA6; }
    .ok { fill: none; stroke: #009E73; stroke-width: 1.25; stroke-linecap: round; stroke-linejoin: round; }
    .bad { fill: none; stroke: #D55E00; stroke-width: 1.25; stroke-linecap: round; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 6 6" refX="5.6" refY="3" markerWidth="4.5" markerHeight="4.5" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0 0.4 L6 3 L0 5.6 Z" fill="#334155"/>
    </marker>
    <marker id="arrow-comm" viewBox="0 0 6 6" refX="5.2" refY="3" markerWidth="5.5" markerHeight="5.5" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0 0.4 L6 3 L0 5.6 Z" fill="#2563EB"/>
    </marker>
    <!-- two-tone icons: line and tint come from the class on <use> -->
    <g id="icon-model" class="ic">
      <path fill="none" d="M3 4 L11 11 L19 4 M3 18 L11 11 L19 18 M3 4 V18 M19 4 V18"/>
      <circle cx="3" cy="4" r="2.6"/><circle cx="3" cy="18" r="2.6"/>
      <circle cx="19" cy="4" r="2.6"/><circle cx="19" cy="18" r="2.6"/>
      <circle cx="11" cy="11" r="3.4"/>
    </g>
    <g id="icon-db" class="ic">
      <path d="M1 4 V18 A8 3 0 0 0 17 18 V4 Z"/>
      <ellipse cx="9" cy="4" rx="8" ry="3"/>
      <path fill="none" d="M1 11 A8 3 0 0 0 17 11"/>
    </g>
    <g id="icon-server" class="ic">
      <rect x="1" y="2" width="18" height="7" rx="1.5"/>
      <rect x="1" y="11" width="18" height="7" rx="1.5"/>
      <path fill="none" d="M4.5 5.5 H5 M4.5 14.5 H5 M10 5.5 H15.5 M10 14.5 H15.5"/>
    </g>
    <g id="icon-doc" class="ic">
      <path d="M1 1 H9 L13 5 V17 H1 Z"/>
      <path fill="none" d="M9 1 V5 H13 M4 9 H10 M4 12.5 H10"/>
    </g>
    <g id="icon-lock" class="ic">
      <rect x="1" y="5" width="8" height="6.5" rx="1"/>
      <path fill="none" d="M3 5 V3.5 A2 2 0 0 1 7 3.5 V5"/>
    </g>
    <path id="icon-ok" class="ok" d="M0 3.5 L2.8 6.3 L7.5 0.5"/>
    <path id="icon-bad" class="bad" d="M0.5 0.5 L6.5 6.5 M6.5 0.5 L0.5 6.5"/>
  </defs>

  <!-- surfaces: a role colour only where the role is named; steps are neutral cards -->
  <text class="h" x="1" y="9">Surfaces and cards</text>

  <rect class="blue" x="1" y="16" width="86" height="46" rx="4"/>
  <text class="h" x="9" y="35">Server</text>
  <text x="9" y="47">Federated side</text>

  <rect class="method" x="96" y="16" width="86" height="46" rx="4"/>
  <text class="h" x="104" y="35">Method</text>
  <text x="104" y="47">Ours, by a baseline</text>

  <rect class="plain" x="191" y="16" width="86" height="46" rx="4"/>
  <text class="h" x="199" y="35">Baseline</text>
  <text x="199" y="47">Neutral part</text>

  <rect class="client" x="286" y="16" width="86" height="46" rx="4"/>
  <rect class="boundary" x="286" y="16" width="86" height="46" rx="4"/>
  <text class="h" x="294" y="35">Client</text>
  <text x="294" y="47">Private side</text>

  <rect class="card" x="381" y="16" width="86" height="46" rx="4"/>
  <path class="card-band" d="M381 34 V20 A4 4 0 0 1 385 16 H463 A4 4 0 0 1 467 20 V34 Z"/>
  <rect class="card-line" x="381" y="16" width="86" height="46" rx="4"/>
  <circle class="card-badge" cx="393" cy="25" r="6"/>
  <text class="b mid" x="393" y="28">1</text>
  <text class="b" x="404" y="28">Step</text>
  <text x="389" y="50">A step card</text>

  <!-- chips and marks -->
  <text class="h" x="1" y="81">Chips and marks</text>
  <rect class="chip" x="1" y="89" width="30" height="11" rx="2.5"/>
  <text class="mid" x="16" y="97.3">SQL 1</text>
  <rect class="chip-ok" x="39" y="89" width="30" height="11" rx="2.5"/>
  <text class="mid" x="54" y="97.3">SQL 1</text>
  <rect class="chip-bad" x="77" y="89" width="30" height="11" rx="2.5"/>
  <text class="mid" x="92" y="97.3">SQL 2</text>
  <rect class="chip-blue" x="115" y="88.5" width="34" height="12" rx="2.5"/>
  <text class="mid" x="132" y="97">Adapter</text>
  <rect class="chip-method" x="157" y="88.5" width="34" height="12" rx="2.5"/>
  <text class="mid" x="174" y="97">Ours</text>
  <use href="#icon-ok" x="209" y="91"/>
  <text x="221" y="97.3">correct</text>
  <use href="#icon-bad" x="263" y="91"/>
  <text x="274" y="97.3">incorrect</text>

  <!-- icons -->
  <text class="h" x="1" y="121">Icons</text>
  <use href="#icon-model" class="ic-method" x="1" y="128"/>
  <text x="27" y="142">Model</text>
  <use href="#icon-model" class="ic-slate" x="66" y="128"/>
  <text x="92" y="142">Model, baseline</text>
  <use href="#icon-db" class="ic-amber" x="166" y="128"/>
  <text x="188" y="142">Database</text>
  <use href="#icon-server" class="ic-blue" x="238" y="129"/>
  <text x="262" y="142">Server</text>
  <use href="#icon-doc" class="ic-amber" x="304" y="130"/>
  <text x="322" y="142">Text, SQL</text>
  <use href="#icon-lock" class="ic-amber" x="374" y="132"/>
  <text x="388" y="142">Private</text>

  <!-- connectors and text -->
  <text class="h" x="1" y="169">Connectors</text>
  <path class="flow" d="M1 182 H51"/>
  <text x="1" y="196">Flow inside one party</text>
  <path class="comm" d="M96 182 H146"/>
  <text x="96" y="196">Sent between parties</text>
  <path class="rule" d="M191 182 H241"/>
  <text x="191" y="196">Rule in a table</text>

  <text class="h" x="286" y="169">Text</text>
  <text class="h" x="286" y="181">Name or heading, 9 pt bold</text>
  <text x="286" y="192">Label, 8 pt, <tspan class="b">key term bold</tspan></text>
  <text x="286" y="203"><tspan class="i">Note in italic,</tspan> variable <tspan class="i">θ</tspan><tspan class="sub" dy="2">t+1</tspan></text>
</svg>
