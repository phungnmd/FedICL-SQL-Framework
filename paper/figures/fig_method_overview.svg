<svg xmlns="http://www.w3.org/2000/svg" width="337" height="351" viewBox="0 0 337 351" role="img" aria-labelledby="fig-method-title fig-method-desc">
  <title id="fig-method-title">Method overview</title>
  <desc id="fig-method-desc">After two warm-up rounds of FedAvg SFT, in every preference round each client samples SQL queries from the global model, executes them on its private databases to label each sample correct or incorrect, pairs correct with incorrect samples, trains its LoRA adapter with the preference term and the NLL term and returns the adapter, which the server averages into the next global model.</desc>

  <!-- style block and defs of paper/figures/template.svg, unchanged -->
  <style>
    text { font-family: Arial, Helvetica, sans-serif; font-size: 8px; fill: #000; }
    .h { font-size: 9px; font-weight: bold; }
    .b { font-weight: bold; }
    .i { font-style: italic; }
    .sub { font-size: 6px; }
    .mid { text-anchor: middle; }
    .end { text-anchor: end; }
    .blue { fill: #E8F0FE; stroke: #2563EB; stroke-width: 0.75; }
    .violet { fill: #F1EBFE; stroke: #7C3AED; stroke-width: 0.75; }
    .plain { fill: #F1F5F9; stroke: #94A3B8; stroke-width: 0.5; }
    .client { fill: #FFF7E6; }
    .boundary { fill: none; stroke: #B45309; stroke-width: 0.75; stroke-dasharray: 3 2; }
    .card { fill: #FFFFFF; }
    .card-band { fill: #E9DFFD; }
    .card-line { fill: none; stroke: #7C3AED; stroke-width: 0.75; }
    .card-badge { fill: #CDBBFA; }
    .chip { fill: #FFFFFF; stroke: #94A3B8; stroke-width: 0.5; }
    .chip-blue { fill: #FFFFFF; stroke: #2563EB; stroke-width: 0.5; }
    .chip-violet { fill: #F1EBFE; stroke: #7C3AED; stroke-width: 0.5; }
    .chip-ok { fill: #DDF3EB; stroke: #009E73; stroke-width: 0.5; }
    .chip-bad { fill: #FBE5D8; stroke: #D55E00; stroke-width: 0.5; }
    .flow { fill: none; stroke: #334155; stroke-width: 0.75; marker-end: url(#arrow); }
    .comm { fill: none; stroke: #2563EB; stroke-width: 1.25; marker-end: url(#arrow-comm); }
    .ic { stroke-width: 1; stroke-linecap: round; stroke-linejoin: round; }
    .ic-blue { stroke: #1D4ED8; fill: #C9DCFC; }
    .ic-violet { stroke: #6D28D9; fill: #DDD0FC; }
    .ic-amber { stroke: #B45309; fill: #FBDFA6; }
    .ok { fill: none; stroke: #009E73; stroke-width: 1.25; stroke-linecap: round; stroke-linejoin: round; }
    .bad { fill: none; stroke: #D55E00; stroke-width: 1.25; stroke-linecap: round; }
    .legend { fill: #F1F5F9; }
    .sw-blue { fill: #2563EB; }
    .sw-violet { fill: #7C3AED; }
    .sw-amber { fill: #D98A0B; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 6 6" refX="5.6" refY="3" markerWidth="4.5" markerHeight="4.5" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0 0.4 L6 3 L0 5.6 Z" fill="#334155"/>
    </marker>
    <marker id="arrow-comm" viewBox="0 0 6 6" refX="5.2" refY="3" markerWidth="5.5" markerHeight="5.5" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0 0.4 L6 3 L0 5.6 Z" fill="#2563EB"/>
    </marker>
    <!-- two-tone icons: line and tint come from the class on <use> -->
    <g id="icon-model" class="ic">
      <path fill="none" d="M3 4 L11 11 L19 4 M3 18 L11 11 L19 18 M3 4 V18 M19 4 V18"/>
      <circle cx="3" cy="4" r="2.6"/><circle cx="3" cy="18" r="2.6"/>
      <circle cx="19" cy="4" r="2.6"/><circle cx="19" cy="18" r="2.6"/>
      <circle cx="11" cy="11" r="3.4"/>
    </g>
    <g id="icon-db" class="ic">
      <path d="M1 4 V18 A8 3 0 0 0 17 18 V4 Z"/>
      <ellipse cx="9" cy="4" rx="8" ry="3"/>
      <path fill="none" d="M1 11 A8 3 0 0 0 17 11"/>
    </g>
    <g id="icon-server" class="ic">
      <rect x="1" y="2" width="18" height="7" rx="1.5"/>
      <rect x="1" y="11" width="18" height="7" rx="1.5"/>
      <path fill="none" d="M4.5 5.5 H5 M4.5 14.5 H5 M10 5.5 H15.5 M10 14.5 H15.5"/>
    </g>
    <g id="icon-doc" class="ic">
      <path d="M1 1 H9 L13 5 V17 H1 Z"/>
      <path fill="none" d="M9 1 V5 H13 M4 9 H10 M4 12.5 H10"/>
    </g>
    <g id="icon-lock" class="ic">
      <rect x="1" y="5" width="8" height="6.5" rx="1"/>
      <path fill="none" d="M3 5 V3.5 A2 2 0 0 1 7 3.5 V5"/>
    </g>
    <path id="icon-ok" class="ok" d="M0 3.5 L2.8 6.3 L7.5 0.5"/>
    <path id="icon-bad" class="bad" d="M0.5 0.5 L6.5 6.5 M6.5 0.5 L0.5 6.5"/>
  </defs>

  <!-- stages: the second one is the round drawn below -->
  <path class="flow" d="M117 15 H133"/>
  <path class="flow" d="M253 15 H269"/>
  <rect class="blue" x="1" y="1" width="116" height="28" rx="4"/>
  <text class="h" x="9" y="13">Warm-up rounds</text>
  <text x="9" y="23">2 FedAvg rounds, gold SQL</text>
  <rect class="violet" x="133" y="1" width="120" height="28" rx="4"/>
  <text class="h" x="141" y="13">Preference rounds</text>
  <text x="141" y="23">Every round <tspan class="i">t</tspan>, shown below</text>
  <rect class="plain" x="269" y="1" width="67" height="28" rx="4"/>
  <text class="h" x="277" y="13">Deploy</text>
  <text x="277" y="23">Global model</text>

  <!-- server -->
  <rect class="blue" x="1" y="42" width="335" height="34" rx="4"/>
  <use href="#icon-server" class="ic-blue" x="9" y="49"/>
  <text class="h" x="36" y="56">Server</text>
  <text x="36" y="68">FedAvg, weighted by number of pairs</text>
  <rect class="chip-blue" x="190" y="53" width="22" height="12" rx="2.5"/>
  <text class="mid" x="201" y="61.5"><tspan class="i">θ</tspan><tspan class="sub" dy="2">1</tspan><tspan class="sub" dx="-3.3" dy="-6">t</tspan></text>
  <rect class="chip-blue" x="215" y="53" width="22" height="12" rx="2.5"/>
  <text class="mid" x="226" y="61.5"><tspan class="i">θ</tspan><tspan class="sub" dy="2">2</tspan><tspan class="sub" dx="-3.3" dy="-6">t</tspan></text>
  <text class="mid" x="243" y="61.5">…</text>
  <rect class="chip-blue" x="249" y="53" width="22" height="12" rx="2.5"/>
  <text class="mid" x="260" y="61.5"><tspan class="i">θ</tspan><tspan class="sub" dy="2">K</tspan><tspan class="sub" dx="-4" dy="-6">t</tspan></text>
  <path class="flow" d="M275 59 H287"/>
  <use href="#icon-model" class="ic-blue" x="290" y="48"/>
  <text x="315" y="61.5"><tspan class="i">θ</tspan><tspan class="sub" dy="-3.5">t</tspan></text>

  <!-- client k inside its privacy boundary -->
  <rect class="client" x="1" y="118" width="335" height="202" rx="4"/>
  <rect class="boundary" x="1" y="118" width="335" height="202" rx="4"/>
  <text class="mid" x="168.5" y="132"><tspan class="h">Client </tspan><tspan class="h i">k</tspan><tspan dx="6">(one of </tspan><tspan class="i">K</tspan> clients)</text>
  <use href="#icon-lock" class="ic-amber" x="9" y="302"/>
  <text x="24" y="312">Questions, gold SQL and databases <tspan class="b">never leave the client</tspan></text>

  <!-- what travels between server and client -->
  <path class="comm" d="M85.5 76 V140"/>
  <path class="comm" d="M251.5 140 V76"/>
  <text class="end" x="79" y="100">Global model <tspan class="i">θ</tspan><tspan class="sub" dy="-3.5">t−1</tspan></text>
  <text x="258" y="100">Adapter <tspan class="i">θ</tspan><tspan class="sub" dy="2">k</tspan><tspan class="sub" dx="-3" dy="-6">t</tspan></text>
  <text class="mid i" x="168.5" y="94">Only adapters and pair counts travel</text>
  <text class="mid i" x="168.5" y="106">Next round samples again from θ<tspan class="sub" dy="-3.5">t</tspan></text>

  <!-- flow between the four steps: down, across, up -->
  <path class="flow" d="M85.5 211 V227"/>
  <path class="flow" d="M162 262.5 H175"/>
  <path class="flow" d="M251.5 227 V211"/>

  <!-- 1 sample -->
  <rect class="card" x="9" y="140" width="153" height="71" rx="4"/>
  <path class="card-band" d="M9 158 V144 A4 4 0 0 1 13 140 H158 A4 4 0 0 1 162 144 V158 Z"/>
  <rect class="card-line" x="9" y="140" width="153" height="71" rx="4"/>
  <circle class="card-badge" cx="21" cy="149" r="6"/>
  <text class="b mid" x="21" y="152">1</text>
  <text class="b" x="32" y="152">Sample</text>
  <use href="#icon-doc" class="ic-amber" x="17" y="175.5"/>
  <path class="flow" d="M32.5 184.5 H38"/>
  <use href="#icon-model" class="ic-violet" x="40" y="173.5"/>
  <path class="flow" d="M63.5 184.5 H69"/>
  <rect class="chip" x="71" y="165" width="28" height="11" rx="2.5"/>
  <text class="mid" x="85" y="173.3">SQL 1</text>
  <rect class="chip" x="71" y="179" width="28" height="11" rx="2.5"/>
  <text class="mid" x="85" y="187.3">SQL 2</text>
  <rect class="chip" x="71" y="193" width="28" height="11" rx="2.5"/>
  <text class="mid" x="85" y="201.3">SQL 3</text>
  <text x="107" y="178"><tspan class="i">N</tspan> = 10 SQL</text>
  <text x="107" y="188">per question,</text>
  <text x="107" y="198">from <tspan class="i">θ</tspan><tspan class="sub" dy="-3.5">t−1</tspan></text>

  <!-- 2 execute -->
  <rect class="card" x="9" y="227" width="153" height="71" rx="4"/>
  <path class="card-band" d="M9 245 V231 A4 4 0 0 1 13 227 H158 A4 4 0 0 1 162 231 V245 Z"/>
  <rect class="card-line" x="9" y="227" width="153" height="71" rx="4"/>
  <circle class="card-badge" cx="21" cy="236" r="6"/>
  <text class="b mid" x="21" y="239">2</text>
  <text class="b" x="32" y="239">Execute</text>
  <use href="#icon-db" class="ic-amber" x="17" y="260.5"/>
  <rect class="chip" x="41" y="252" width="30" height="11" rx="2.5"/>
  <text class="mid" x="56" y="260.3">SQL 1</text>
  <use href="#icon-ok" x="76.5" y="254"/>
  <rect class="chip" x="41" y="266" width="30" height="11" rx="2.5"/>
  <text class="mid" x="56" y="274.3">SQL 2</text>
  <use href="#icon-bad" x="77" y="268"/>
  <rect class="chip" x="41" y="280" width="30" height="11" rx="2.5"/>
  <text class="mid" x="56" y="288.3">SQL 3</text>
  <use href="#icon-bad" x="77" y="282"/>
  <text x="94" y="265">Run on private</text>
  <text x="94" y="275">databases:</text>
  <text class="b" x="94" y="285">execution label</text>

  <!-- 3 pair -->
  <rect class="card" x="175" y="227" width="153" height="71" rx="4"/>
  <path class="card-band" d="M175 245 V231 A4 4 0 0 1 179 227 H324 A4 4 0 0 1 328 231 V245 Z"/>
  <rect class="card-line" x="175" y="227" width="153" height="71" rx="4"/>
  <circle class="card-badge" cx="187" cy="236" r="6"/>
  <text class="b mid" x="187" y="239">3</text>
  <text class="b" x="198" y="239">Pair</text>
  <rect class="chip-ok" x="183" y="258" width="30" height="11" rx="2.5"/>
  <text class="mid" x="198" y="266.3">SQL 1</text>
  <text class="b mid" x="220" y="266.3">&gt;</text>
  <rect class="chip-bad" x="227" y="258" width="30" height="11" rx="2.5"/>
  <text class="mid" x="242" y="266.3">SQL 2</text>
  <rect class="chip-ok" x="183" y="274" width="30" height="11" rx="2.5"/>
  <text class="mid" x="198" y="282.3">SQL 1</text>
  <text class="b mid" x="220" y="282.3">&gt;</text>
  <rect class="chip-bad" x="227" y="274" width="30" height="11" rx="2.5"/>
  <text class="mid" x="242" y="282.3">SQL 3</text>
  <text class="b" x="266" y="265">Preference</text>
  <text x="266" y="275"><tspan class="b">pairs:</tspan> correct</text>
  <text x="266" y="285">over incorrect</text>

  <!-- 4 train -->
  <rect class="card" x="175" y="140" width="153" height="71" rx="4"/>
  <path class="card-band" d="M175 158 V144 A4 4 0 0 1 179 140 H324 A4 4 0 0 1 328 144 V158 Z"/>
  <rect class="card-line" x="175" y="140" width="153" height="71" rx="4"/>
  <circle class="card-badge" cx="187" cy="149" r="6"/>
  <text class="b mid" x="187" y="152">4</text>
  <text class="b" x="198" y="152">Train</text>
  <use href="#icon-model" class="ic-violet" x="183" y="162"/>
  <text class="b mid" x="212" y="176">+</text>
  <rect class="chip-violet" x="219" y="167" width="32" height="12" rx="2.5"/>
  <text class="mid" x="235" y="175.8">LoRA</text>
  <text class="mid" x="217" y="201"><tspan class="i">L</tspan> = <tspan class="i">L</tspan><tspan class="sub" dy="2">DPO</tspan><tspan dy="-2"> + </tspan><tspan class="i">λL</tspan><tspan class="sub" dy="2">NLL</tspan></text>
  <text class="b" x="262" y="178">DPO + NLL</text>
  <text x="262" y="188">on the pairs,</text>
  <text x="262" y="198">reference = <tspan class="i">θ</tspan><tspan class="sub" dy="-3.5">t−1</tspan></text>

  <!-- colour key -->
  <rect class="legend" x="1" y="329" width="335" height="20" rx="4"/>
  <rect class="sw-blue" x="9" y="335" width="8" height="8" rx="2"/>
  <text x="21" y="342">Federated averaging</text>
  <rect class="sw-violet" x="115" y="335" width="8" height="8" rx="2"/>
  <text x="127" y="342">Steps of the method</text>
  <rect class="sw-amber" x="221" y="335" width="8" height="8" rx="2"/>
  <text x="233" y="342">Private client data</text>
</svg>
