<svg xmlns="http://www.w3.org/2000/svg" width="468" height="298" viewBox="0 0 468 298" role="img" aria-labelledby="fig-method-title fig-method-desc">
  <title id="fig-method-title">Method overview</title>
  <desc id="fig-method-desc">Every round, the server sends the global model to each of the K clients and averages the adapters they return; the panel opens client k. In the warm-up rounds a client trains on the gold SQL queries with the NLL loss, as in FedAvg SFT. In each preference round it samples SQL queries from the global model, executes them on its private databases to label each sample correct or incorrect against the result of the gold SQL query, pairs correct with incorrect samples and trains its LoRA adapter with the preference term and the NLL term. Only the adapter and one count leave a client.</desc>

  <!-- Copy this style block and the defs into every figure, unchanged. -->
  <style>
    text { font-family: Arial, Helvetica, sans-serif; font-size: 8px; fill: #000; }
    .h { font-size: 9px; font-weight: bold; }
    .b { font-weight: bold; }
    .i { font-style: italic; }
    .sub { font-size: 6px; }
    .mid { text-anchor: middle; }
    .end { text-anchor: end; }
    .blue { fill: #E8F0FE; stroke: #2563EB; stroke-width: 0.75; }
    .method { fill: #F8EAF2; stroke: #A8528A; stroke-width: 0.75; }
    .plain { fill: #F1F5F9; stroke: #94A3B8; stroke-width: 0.5; }
    .client { fill: #FFF7E6; }
    .boundary { fill: none; stroke: #B45309; stroke-width: 0.75; stroke-dasharray: 3 2; }
    .card { fill: #FFFFFF; }
    .card-band { fill: #F1F5F9; }
    .card-line { fill: none; stroke: #94A3B8; stroke-width: 0.75; }
    .card-badge { fill: #EFD3E3; }
    .rule { fill: none; stroke: #CBD5E1; stroke-width: 0.5; }
    .chip { fill: #FFFFFF; stroke: #94A3B8; stroke-width: 0.5; }
    .chip-blue { fill: #FFFFFF; stroke: #2563EB; stroke-width: 0.5; }
    .chip-method { fill: #F8EAF2; stroke: #A8528A; stroke-width: 0.5; }
    .chip-ok { fill: #DDF3EB; stroke: #009E73; stroke-width: 0.5; }
    .chip-bad { fill: #FBE5D8; stroke: #D55E00; stroke-width: 0.5; }
    .flow { fill: none; stroke: #334155; stroke-width: 0.75; marker-end: url(#arrow); }
    .comm { fill: none; stroke: #2563EB; stroke-width: 1.25; marker-end: url(#arrow-comm); }
    .ic { stroke-width: 1; stroke-linecap: round; stroke-linejoin: round; }
    .ic-blue { stroke: #1D4ED8; fill: #C9DCFC; }
    .ic-method { stroke: #8E3F74; fill: #EFD3E3; }
    .ic-slate { stroke: #475569; fill: #E2E8F0; }
    .ic-amber { stroke: #B45309; fill: #FBDFA6; }
    .ok { fill: none; stroke: #009E73; stroke-width: 1.25; stroke-linecap: round; stroke-linejoin: round; }
    .bad { fill: none; stroke: #D55E00; stroke-width: 1.25; stroke-linecap: round; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 6 6" refX="5.6" refY="3" markerWidth="4.5" markerHeight="4.5" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0 0.4 L6 3 L0 5.6 Z" fill="#334155"/>
    </marker>
    <marker id="arrow-comm" viewBox="0 0 6 6" refX="5.2" refY="3" markerWidth="5.5" markerHeight="5.5" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0 0.4 L6 3 L0 5.6 Z" fill="#2563EB"/>
    </marker>
    <!-- two-tone icons: line and tint come from the class on <use> -->
    <g id="icon-model" class="ic">
      <path fill="none" d="M3 4 L11 11 L19 4 M3 18 L11 11 L19 18 M3 4 V18 M19 4 V18"/>
      <circle cx="3" cy="4" r="2.6"/><circle cx="3" cy="18" r="2.6"/>
      <circle cx="19" cy="4" r="2.6"/><circle cx="19" cy="18" r="2.6"/>
      <circle cx="11" cy="11" r="3.4"/>
    </g>
    <g id="icon-db" class="ic">
      <path d="M1 4 V18 A8 3 0 0 0 17 18 V4 Z"/>
      <ellipse cx="9" cy="4" rx="8" ry="3"/>
      <path fill="none" d="M1 11 A8 3 0 0 0 17 11"/>
    </g>
    <g id="icon-server" class="ic">
      <rect x="1" y="2" width="18" height="7" rx="1.5"/>
      <rect x="1" y="11" width="18" height="7" rx="1.5"/>
      <path fill="none" d="M4.5 5.5 H5 M4.5 14.5 H5 M10 5.5 H15.5 M10 14.5 H15.5"/>
    </g>
    <g id="icon-doc" class="ic">
      <path d="M1 1 H9 L13 5 V17 H1 Z"/>
      <path fill="none" d="M9 1 V5 H13 M4 9 H10 M4 12.5 H10"/>
    </g>
    <g id="icon-lock" class="ic">
      <rect x="1" y="5" width="8" height="6.5" rx="1"/>
      <path fill="none" d="M3 5 V3.5 A2 2 0 0 1 7 3.5 V5"/>
    </g>
    <path id="icon-ok" class="ok" d="M0 3.5 L2.8 6.3 L7.5 0.5"/>
    <path id="icon-bad" class="bad" d="M0.5 0.5 L6.5 6.5 M6.5 0.5 L0.5 6.5"/>
  </defs>

  <!-- server -->
  <rect class="blue" x="1" y="1" width="466" height="32" rx="4"/>
  <use href="#icon-server" class="ic-blue" x="9" y="7"/>
  <text class="h" x="35" y="15">Server</text>
  <text x="35" y="26">FedAvg, weighted by number of questions (warm-up) or of pairs (preference)</text>
  <rect class="chip-blue" x="318" y="11" width="22" height="12" rx="2.5"/>
  <text class="mid" x="329" y="19.5"><tspan class="i">θ</tspan><tspan class="sub" dy="2">1</tspan><tspan class="sub" dx="-3.3" dy="-6">t</tspan></text>
  <rect class="chip-blue" x="343" y="11" width="22" height="12" rx="2.5"/>
  <text class="mid" x="354" y="19.5"><tspan class="i">θ</tspan><tspan class="sub" dy="2">2</tspan><tspan class="sub" dx="-3.3" dy="-6">t</tspan></text>
  <text class="mid" x="371" y="19.5">…</text>
  <rect class="chip-blue" x="377" y="11" width="22" height="12" rx="2.5"/>
  <text class="mid" x="388" y="19.5"><tspan class="i">θ</tspan><tspan class="sub" dy="2">K</tspan><tspan class="sub" dx="-4" dy="-6">t</tspan></text>
  <path class="flow" d="M403 17 H415"/>
  <use href="#icon-model" class="ic-blue" x="418" y="6"/>
  <text x="443" y="19.5"><tspan class="i">θ</tspan><tspan class="sub" dy="-3.5">t</tspan></text>

  <!-- the K clients: client k is opened as the panel below -->
  <rect class="client" x="1" y="57" width="80" height="26" rx="4"/>
  <rect class="boundary" x="1" y="57" width="80" height="26" rx="4"/>
  <use href="#icon-db" class="ic-amber" x="9" y="59"/>
  <text class="h" x="33" y="73.5">Client 1</text>
  <rect class="client" x="387" y="57" width="80" height="26" rx="4"/>
  <rect class="boundary" x="387" y="57" width="80" height="26" rx="4"/>
  <use href="#icon-db" class="ic-amber" x="395" y="59"/>
  <text class="h" x="419" y="73.5">Client <tspan class="i">K</tspan></text>
  <text class="mid h" x="137.5" y="73">⋯</text>
  <text class="mid h" x="330.5" y="73">⋯</text>
  <path class="client" d="M1 95 A4 4 0 0 1 5 91 H194 V61 A4 4 0 0 1 198 57 H270 A4 4 0 0 1 274 61 V91 H463 A4 4 0 0 1 467 95 V292 A4 4 0 0 1 463 296 H5 A4 4 0 0 1 1 292 Z"/>
  <path class="boundary" d="M1 95 A4 4 0 0 1 5 91 H194 V61 A4 4 0 0 1 198 57 H270 A4 4 0 0 1 274 61 V91 H463 A4 4 0 0 1 467 95 V292 A4 4 0 0 1 463 296 H5 A4 4 0 0 1 1 292 Z"/>
  <use href="#icon-db" class="ic-amber" x="202" y="59"/>
  <text class="h" x="226" y="73.5">Client <tspan class="i">k</tspan></text>

  <!-- what travels between the server and each client -->
  <path class="comm" d="M21 33 V57"/>
  <path class="comm" d="M61 57 V33"/>
  <path class="comm" d="M214 33 V57"/>
  <path class="comm" d="M254 57 V33"/>
  <path class="comm" d="M407 33 V57"/>
  <path class="comm" d="M447 57 V33"/>
  <text class="end" x="208" y="48">Global model <tspan class="i">θ</tspan><tspan class="sub" dy="-3.5">t−1</tspan></text>
  <text x="260" y="48">Adapter <tspan class="i">θ</tspan><tspan class="sub" dy="2">k</tspan><tspan class="sub" dx="-3" dy="-6">t</tspan><tspan dx="3.5" dy="4">and count</tspan></text>

  <use href="#icon-lock" class="ic-amber" x="9" y="279"/>
  <text x="24" y="289">Questions, gold SQL and databases <tspan class="b">never leave the client</tspan></text>

  <!-- warm-up rounds: FedAvg SFT, the gold SQL is the target -->
  <rect class="plain" x="9" y="99" width="450" height="34" rx="4"/>
  <text class="h" x="17" y="113">Warm-up rounds</text>
  <text x="17" y="125"><tspan class="i">t</tspan> = 1, …, <tspan class="i">T</tspan><tspan class="sub" dy="2">w</tspan><tspan dy="-2"></tspan></text>
  <path class="flow" d="M154 116 H166"/>
  <path class="flow" d="M192 116 H216"/>
  <rect class="chip" x="120" y="110" width="34" height="12" rx="2.5"/>
  <text class="mid" x="137" y="118.6">Prompt</text>
  <use href="#icon-model" class="ic-slate" x="168" y="105"/>
  <text class="mid" x="204" y="112">NLL</text>
  <rect class="chip" x="218" y="110" width="42" height="12" rx="2.5"/>
  <text class="mid" x="239" y="118.6">Gold SQL</text>
  <text class="i end" x="451" y="119">as in FedAvg SFT: gold SQL is the training target</text>

  <!-- preference rounds: the four steps -->
  <rect class="method" x="9" y="141" width="450" height="132" rx="4"/>
  <text class="h" x="17" y="155">Preference rounds</text>
  <text x="104" y="155"><tspan class="i">t</tspan> = <tspan class="i">T</tspan><tspan class="sub" dy="2">w</tspan><tspan dy="-2"> + 1, …, </tspan><tspan class="i">T</tspan></text>
  <text class="i end" x="451" y="155">gold SQL is the reference for the labels, not a target</text>
  <path class="flow" d="M118 205 H126"/>
  <path class="flow" d="M229 205 H237"/>
  <path class="flow" d="M340 205 H348"/>

  <rect class="card" x="17" y="163" width="101" height="102" rx="4"/>
  <path class="card-band" d="M17 181 V167 A4 4 0 0 1 21 163 H114 A4 4 0 0 1 118 167 V181 Z"/>
  <rect class="card-line" x="17" y="163" width="101" height="102" rx="4"/>
  <circle class="card-badge" cx="29" cy="172" r="6"/>
  <text class="b mid" x="29" y="175">1</text>
  <text class="b" x="40" y="175">Sample</text>
  <use href="#icon-doc" class="ic-amber" x="25" y="196"/>
  <path class="flow" d="M41 205 H47"/>
  <use href="#icon-model" class="ic-method" x="49" y="194"/>
  <path class="flow" d="M73 205 H79"/>
  <rect class="chip" x="81" y="188" width="28" height="11" rx="2.5"/>
  <text class="mid" x="95.0" y="196.3">SQL 1</text>
  <rect class="chip" x="81" y="200" width="28" height="11" rx="2.5"/>
  <text class="mid" x="95.0" y="208.3">SQL 2</text>
  <rect class="chip" x="81" y="212" width="28" height="11" rx="2.5"/>
  <text class="mid" x="95.0" y="220.3">SQL 3</text>
  <text x="25" y="239"><tspan class="i">N</tspan> = 10 SQL per</text>
  <text x="25" y="249">question, from <tspan class="i">θ</tspan><tspan class="sub" dy="-3.5">t−1</tspan></text>

  <rect class="card" x="128" y="163" width="101" height="102" rx="4"/>
  <path class="card-band" d="M128 181 V167 A4 4 0 0 1 132 163 H225 A4 4 0 0 1 229 167 V181 Z"/>
  <rect class="card-line" x="128" y="163" width="101" height="102" rx="4"/>
  <circle class="card-badge" cx="140" cy="172" r="6"/>
  <text class="b mid" x="140" y="175">2</text>
  <text class="b" x="151" y="175">Execute</text>
  <use href="#icon-db" class="ic-amber" x="136" y="194"/>
  <rect class="chip" x="162" y="188" width="30" height="11" rx="2.5"/>
  <text class="mid" x="177.0" y="196.3">SQL 1</text>
  <rect class="chip" x="162" y="200" width="30" height="11" rx="2.5"/>
  <text class="mid" x="177.0" y="208.3">SQL 2</text>
  <rect class="chip" x="162" y="212" width="30" height="11" rx="2.5"/>
  <text class="mid" x="177.0" y="220.3">SQL 3</text>
  <use href="#icon-ok" x="198" y="190"/>
  <use href="#icon-bad" x="198.5" y="202"/>
  <use href="#icon-bad" x="198.5" y="214"/>
  <text x="136" y="239">Run on private</text>
  <text x="136" y="249">databases:</text>
  <text class="b" x="136" y="259">execution label</text>

  <rect class="card" x="239" y="163" width="101" height="102" rx="4"/>
  <path class="card-band" d="M239 181 V167 A4 4 0 0 1 243 163 H336 A4 4 0 0 1 340 167 V181 Z"/>
  <rect class="card-line" x="239" y="163" width="101" height="102" rx="4"/>
  <circle class="card-badge" cx="251" cy="172" r="6"/>
  <text class="b mid" x="251" y="175">3</text>
  <text class="b" x="262" y="175">Pair</text>
  <rect class="chip-ok" x="252" y="193" width="30" height="11" rx="2.5"/>
  <text class="mid" x="267.0" y="201.3">SQL 1</text>
  <text class="b mid" x="291" y="201.3">&gt;</text>
  <rect class="chip-bad" x="298" y="193" width="30" height="11" rx="2.5"/>
  <text class="mid" x="313.0" y="201.3">SQL 2</text>
  <rect class="chip-ok" x="252" y="209" width="30" height="11" rx="2.5"/>
  <text class="mid" x="267.0" y="217.3">SQL 1</text>
  <text class="b mid" x="291" y="217.3">&gt;</text>
  <rect class="chip-bad" x="298" y="209" width="30" height="11" rx="2.5"/>
  <text class="mid" x="313.0" y="217.3">SQL 3</text>
  <text class="b" x="247" y="239">Preference pairs:</text>
  <text x="247" y="249">correct over</text>
  <text x="247" y="259">incorrect</text>

  <rect class="card" x="350" y="163" width="101" height="102" rx="4"/>
  <path class="card-band" d="M350 181 V167 A4 4 0 0 1 354 163 H447 A4 4 0 0 1 451 167 V181 Z"/>
  <rect class="card-line" x="350" y="163" width="101" height="102" rx="4"/>
  <circle class="card-badge" cx="362" cy="172" r="6"/>
  <text class="b mid" x="362" y="175">4</text>
  <text class="b" x="373" y="175">Train</text>
  <use href="#icon-model" class="ic-method" x="361" y="187"/>
  <text class="b mid" x="392" y="201.5">+</text>
  <rect class="chip-blue" x="399" y="192" width="32" height="12" rx="2.5"/>
  <text class="mid" x="415" y="200.8">LoRA</text>
  <text class="mid" x="400" y="223"><tspan class="i">L</tspan> = <tspan class="i">L</tspan><tspan class="sub" dy="2">DPO</tspan><tspan dy="-2"> + </tspan><tspan class="i">λL</tspan><tspan class="sub" dy="2">NLL</tspan></text>
  <text class="b" x="358" y="239">DPO + NLL</text>
  <text x="358" y="249">on the pairs,</text>
  <text x="358" y="259">reference = <tspan class="i">θ</tspan><tspan class="sub" dy="-3.5">t−1</tspan></text>
</svg>
