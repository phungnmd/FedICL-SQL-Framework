<svg xmlns="http://www.w3.org/2000/svg" width="468" height="298" viewBox="0 0 468 298" role="img" aria-labelledby="fig-method-title fig-method-desc">
  <title id="fig-method-title">Method overview</title>
  <desc id="fig-method-desc">Every round, the server sends the global model to the K clients and averages the adapters they return. In the warm-up rounds a client trains on the gold SQL queries with the NLL loss, as in FedAvg SFT. In each preference round it samples SQL queries from the global model, executes them on its private databases to label each sample correct or incorrect against the result of the gold SQL query, pairs correct with incorrect samples and trains its LoRA adapter with the preference term and the NLL term. Only the adapter and one count leave a client.</desc>

  <!-- Copy this style block and the defs into every figure, unchanged. -->
  <style>
    text { font-family: Arial, Helvetica, sans-serif; font-size: 8px; fill: #000; }
    .h { font-size: 9px; font-weight: bold; }
    .b { font-weight: bold; }
    .i { font-style: italic; }
    .sub { font-size: 6px; }
    .mid { text-anchor: middle; }
    .end { text-anchor: end; }
    .blue { fill: #E8F0FE; stroke: #2563EB; stroke-width: 0.75; }
    .method { fill: #F8EAF2; stroke: #A8528A; stroke-width: 0.75; }
    .plain { fill: #F1F5F9; stroke: #94A3B8; stroke-width: 0.5; }
    .client { fill: #FFF7E6; }
    .boundary { fill: none; stroke: #B45309; stroke-width: 0.75; stroke-dasharray: 3 2; }
    .card { fill: #FFFFFF; }
    .card-band { fill: #F1F5F9; }
    .card-line { fill: none; stroke: #94A3B8; stroke-width: 0.75; }
    .card-badge { fill: #EFD3E3; }
    .rule { fill: none; stroke: #CBD5E1; stroke-width: 0.5; }
    .chip { fill: #FFFFFF; stroke: #94A3B8; stroke-width: 0.5; }
    .chip-blue { fill: #FFFFFF; stroke: #2563EB; stroke-width: 0.5; }
    .chip-method { fill: #F8EAF2; stroke: #A8528A; stroke-width: 0.5; }
    .chip-ok { fill: #DDF3EB; stroke: #009E73; stroke-width: 0.5; }
    .chip-bad { fill: #FBE5D8; stroke: #D55E00; stroke-width: 0.5; }
    .flow { fill: none; stroke: #334155; stroke-width: 0.75; marker-end: url(#arrow); }
    .comm { fill: none; stroke: #2563EB; stroke-width: 1.25; marker-end: url(#arrow-comm); }
    .ic { stroke-width: 1; stroke-linecap: round; stroke-linejoin: round; }
    .ic-blue { stroke: #1D4ED8; fill: #C9DCFC; }
    .ic-method { stroke: #8E3F74; fill: #EFD3E3; }
    .ic-slate { stroke: #475569; fill: #E2E8F0; }
    .ic-amber { stroke: #B45309; fill: #FBDFA6; }
    .ok { fill: none; stroke: #009E73; stroke-width: 1.25; stroke-linecap: round; stroke-linejoin: round; }
    .bad { fill: none; stroke: #D55E00; stroke-width: 1.25; stroke-linecap: round; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 6 6" refX="5.6" refY="3" markerWidth="4.5" markerHeight="4.5" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0 0.4 L6 3 L0 5.6 Z" fill="#334155"/>
    </marker>
    <marker id="arrow-comm" viewBox="0 0 6 6" refX="5.2" refY="3" markerWidth="5.5" markerHeight="5.5" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0 0.4 L6 3 L0 5.6 Z" fill="#2563EB"/>
    </marker>
    <!-- two-tone icons: line and tint come from the class on <use> -->
    <g id="icon-model" class="ic">
      <path fill="none" d="M3 4 L11 11 L19 4 M3 18 L11 11 L19 18 M3 4 V18 M19 4 V18"/>
      <circle cx="3" cy="4" r="2.6"/><circle cx="3" cy="18" r="2.6"/>
      <circle cx="19" cy="4" r="2.6"/><circle cx="19" cy="18" r="2.6"/>
      <circle cx="11" cy="11" r="3.4"/>
    </g>
    <g id="icon-db" class="ic">
      <path d="M1 4 V18 A8 3 0 0 0 17 18 V4 Z"/>
      <ellipse cx="9" cy="4" rx="8" ry="3"/>
      <path fill="none" d="M1 11 A8 3 0 0 0 17 11"/>
    </g>
    <g id="icon-server" class="ic">
      <rect x="1" y="2" width="18" height="7" rx="1.5"/>
      <rect x="1" y="11" width="18" height="7" rx="1.5"/>
      <path fill="none" d="M4.5 5.5 H5 M4.5 14.5 H5 M10 5.5 H15.5 M10 14.5 H15.5"/>
    </g>
    <g id="icon-doc" class="ic">
      <path d="M1 1 H9 L13 5 V17 H1 Z"/>
      <path fill="none" d="M9 1 V5 H13 M4 9 H10 M4 12.5 H10"/>
    </g>
    <g id="icon-lock" class="ic">
      <rect x="1" y="5" width="8" height="6.5" rx="1"/>
      <path fill="none" d="M3 5 V3.5 A2 2 0 0 1 7 3.5 V5"/>
    </g>
    <path id="icon-ok" class="ok" d="M0 3.5 L2.8 6.3 L7.5 0.5"/>
    <path id="icon-bad" class="bad" d="M0.5 0.5 L6.5 6.5 M6.5 0.5 L0.5 6.5"/>
  </defs>

  <!-- server -->
  <rect class="blue" x="1" y="1" width="466" height="32" rx="4"/>
  <use href="#icon-server" class="ic-blue" x="9" y="7"/>
  <text class="h" x="35" y="15">Server</text>
  <text x="35" y="26">FedAvg, weighted by number of questions (warm-up) or of pairs (preference)</text>
  <rect class="chip-blue" x="318" y="11" width="22" height="12" rx="2.5"/>
  <text class="mid" x="329" y="19.5"><tspan class="i">θ</tspan><tspan class="sub" dy="2">1</tspan><tspan class="sub" dx="-3.3" dy="-6">t</tspan></text>
  <rect class="chip-blue" x="343" y="11" width="22" height="12" rx="2.5"/>
  <text class="mid" x="354" y="19.5"><tspan class="i">θ</tspan><tspan class="sub" dy="2">2</tspan><tspan class="sub" dx="-3.3" dy="-6">t</tspan></text>
  <text class="mid" x="371" y="19.5">…</text>
  <rect class="chip-blue" x="377" y="11" width="22" height="12" rx="2.5"/>
  <text class="mid" x="388" y="19.5"><tspan class="i">θ</tspan><tspan class="sub" dy="2">K</tspan><tspan class="sub" dx="-4" dy="-6">t</tspan></text>
  <path class="flow" d="M403 17 H415"/>
  <use href="#icon-model" class="ic-blue" x="418" y="6"/>
  <text x="443" y="19.5"><tspan class="i">θ</tspan><tspan class="sub" dy="-3.5">t</tspan></text>

  <!-- the K clients: client k in front of the others -->
  <rect class="client" x="9" y="78" width="458" height="219" rx="4"/>
  <rect class="boundary" x="9" y="78" width="458" height="219" rx="4"/>
  <rect class="client" x="5" y="74" width="458" height="219" rx="4"/>
  <rect class="boundary" x="5" y="74" width="458" height="219" rx="4"/>
  <rect class="client" x="1" y="70" width="458" height="219" rx="4"/>
  <rect class="boundary" x="1" y="70" width="458" height="219" rx="4"/>

  <!-- what travels between server and client k -->
  <path class="comm" d="M30 33 V70"/>
  <path class="comm" d="M438 70 V33"/>
  <text x="36" y="54">Global model <tspan class="i">θ</tspan><tspan class="sub" dy="-3.5">t−1</tspan></text>
  <text class="end" x="432" y="54">Adapter <tspan class="i">θ</tspan><tspan class="sub" dy="2">k</tspan><tspan class="sub" dx="-3" dy="-6">t</tspan><tspan dx="2" dy="4">and count</tspan></text>
  <text class="mid i" x="228" y="47">Only the adapter and one count leave a client</text>
  <text class="mid i" x="228" y="60">Preference rounds sample again from each new global model</text>

  <text class="mid" x="230" y="84"><tspan class="h">Client </tspan><tspan class="h i">k</tspan><tspan dx="6">(one of </tspan><tspan class="i">K</tspan> clients)</text>
  <use href="#icon-lock" class="ic-amber" x="9" y="271"/>
  <text x="24" y="281">Questions, gold SQL and databases <tspan class="b">never leave the client</tspan></text>

  <!-- warm-up rounds: FedAvg SFT, the gold SQL is the target -->
  <rect class="plain" x="9" y="92" width="442" height="34" rx="4"/>
  <text class="h" x="17" y="106">Warm-up rounds</text>
  <text x="17" y="118"><tspan class="i">t</tspan> = 1, …, <tspan class="i">T</tspan><tspan class="sub" dy="2">w</tspan><tspan dy="-2"></tspan></text>
  <path class="flow" d="M154 109 H166"/>
  <path class="flow" d="M192 109 H216"/>
  <rect class="chip" x="120" y="103" width="34" height="12" rx="2.5"/>
  <text class="mid" x="137" y="111.6">Prompt</text>
  <use href="#icon-model" class="ic-slate" x="168" y="98"/>
  <text class="mid" x="204" y="105">NLL</text>
  <rect class="chip" x="218" y="103" width="42" height="12" rx="2.5"/>
  <text class="mid" x="239" y="111.6">Gold SQL</text>
  <text class="i" x="272" y="112">as in FedAvg SFT: gold SQL is the training target</text>

  <!-- preference rounds: the four steps -->
  <rect class="method" x="9" y="134" width="442" height="132" rx="4"/>
  <text class="h" x="17" y="148">Preference rounds</text>
  <text x="104" y="148"><tspan class="i">t</tspan> = <tspan class="i">T</tspan><tspan class="sub" dy="2">w</tspan><tspan dy="-2"> + 1, …, </tspan><tspan class="i">T</tspan></text>
  <text class="i end" x="443" y="148">gold SQL is the reference for the labels, not a target</text>
  <path class="flow" d="M116 198 H124"/>
  <path class="flow" d="M225 198 H233"/>
  <path class="flow" d="M334 198 H342"/>

  <rect class="card" x="17" y="156" width="99" height="102" rx="4"/>
  <path class="card-band" d="M17 174 V160 A4 4 0 0 1 21 156 H112 A4 4 0 0 1 116 160 V174 Z"/>
  <rect class="card-line" x="17" y="156" width="99" height="102" rx="4"/>
  <circle class="card-badge" cx="29" cy="165" r="6"/>
  <text class="b mid" x="29" y="168">1</text>
  <text class="b" x="40" y="168">Sample</text>
  <use href="#icon-doc" class="ic-amber" x="25" y="189"/>
  <path class="flow" d="M41 198 H47"/>
  <use href="#icon-model" class="ic-method" x="49" y="187"/>
  <path class="flow" d="M73 198 H79"/>
  <rect class="chip" x="81" y="181" width="28" height="11" rx="2.5"/>
  <text class="mid" x="95.0" y="189.3">SQL 1</text>
  <rect class="chip" x="81" y="193" width="28" height="11" rx="2.5"/>
  <text class="mid" x="95.0" y="201.3">SQL 2</text>
  <rect class="chip" x="81" y="205" width="28" height="11" rx="2.5"/>
  <text class="mid" x="95.0" y="213.3">SQL 3</text>
  <text x="25" y="232"><tspan class="i">N</tspan> = 10 SQL per</text>
  <text x="25" y="242">question, from <tspan class="i">θ</tspan><tspan class="sub" dy="-3.5">t−1</tspan></text>

  <rect class="card" x="126" y="156" width="99" height="102" rx="4"/>
  <path class="card-band" d="M126 174 V160 A4 4 0 0 1 130 156 H221 A4 4 0 0 1 225 160 V174 Z"/>
  <rect class="card-line" x="126" y="156" width="99" height="102" rx="4"/>
  <circle class="card-badge" cx="138" cy="165" r="6"/>
  <text class="b mid" x="138" y="168">2</text>
  <text class="b" x="149" y="168">Execute</text>
  <use href="#icon-db" class="ic-amber" x="134" y="187"/>
  <rect class="chip" x="160" y="181" width="30" height="11" rx="2.5"/>
  <text class="mid" x="175.0" y="189.3">SQL 1</text>
  <rect class="chip" x="160" y="193" width="30" height="11" rx="2.5"/>
  <text class="mid" x="175.0" y="201.3">SQL 2</text>
  <rect class="chip" x="160" y="205" width="30" height="11" rx="2.5"/>
  <text class="mid" x="175.0" y="213.3">SQL 3</text>
  <use href="#icon-ok" x="196" y="183"/>
  <use href="#icon-bad" x="196.5" y="195"/>
  <use href="#icon-bad" x="196.5" y="207"/>
  <text x="134" y="232">Run on private</text>
  <text x="134" y="242">databases:</text>
  <text class="b" x="134" y="252">execution label</text>

  <rect class="card" x="235" y="156" width="99" height="102" rx="4"/>
  <path class="card-band" d="M235 174 V160 A4 4 0 0 1 239 156 H330 A4 4 0 0 1 334 160 V174 Z"/>
  <rect class="card-line" x="235" y="156" width="99" height="102" rx="4"/>
  <circle class="card-badge" cx="247" cy="165" r="6"/>
  <text class="b mid" x="247" y="168">3</text>
  <text class="b" x="258" y="168">Pair</text>
  <rect class="chip-ok" x="248" y="186" width="30" height="11" rx="2.5"/>
  <text class="mid" x="263.0" y="194.3">SQL 1</text>
  <text class="b mid" x="287" y="194.3">&gt;</text>
  <rect class="chip-bad" x="294" y="186" width="30" height="11" rx="2.5"/>
  <text class="mid" x="309.0" y="194.3">SQL 2</text>
  <rect class="chip-ok" x="248" y="202" width="30" height="11" rx="2.5"/>
  <text class="mid" x="263.0" y="210.3">SQL 1</text>
  <text class="b mid" x="287" y="210.3">&gt;</text>
  <rect class="chip-bad" x="294" y="202" width="30" height="11" rx="2.5"/>
  <text class="mid" x="309.0" y="210.3">SQL 3</text>
  <text class="b" x="243" y="232">Preference pairs:</text>
  <text x="243" y="242">correct over</text>
  <text x="243" y="252">incorrect</text>

  <rect class="card" x="344" y="156" width="99" height="102" rx="4"/>
  <path class="card-band" d="M344 174 V160 A4 4 0 0 1 348 156 H439 A4 4 0 0 1 443 160 V174 Z"/>
  <rect class="card-line" x="344" y="156" width="99" height="102" rx="4"/>
  <circle class="card-badge" cx="356" cy="165" r="6"/>
  <text class="b mid" x="356" y="168">4</text>
  <text class="b" x="367" y="168">Train</text>
  <use href="#icon-model" class="ic-method" x="355" y="180"/>
  <text class="b mid" x="386" y="194.5">+</text>
  <rect class="chip-blue" x="393" y="185" width="32" height="12" rx="2.5"/>
  <text class="mid" x="409" y="193.8">LoRA</text>
  <text class="mid" x="394" y="216"><tspan class="i">L</tspan> = <tspan class="i">L</tspan><tspan class="sub" dy="2">DPO</tspan><tspan dy="-2"> + </tspan><tspan class="i">λL</tspan><tspan class="sub" dy="2">NLL</tspan></text>
  <text class="b" x="352" y="232">DPO + NLL</text>
  <text x="352" y="242">on the pairs,</text>
  <text x="352" y="252">reference = <tspan class="i">θ</tspan><tspan class="sub" dy="-3.5">t−1</tspan></text>
</svg>
