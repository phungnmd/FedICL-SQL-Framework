<svg xmlns="http://www.w3.org/2000/svg" width="468" height="284" viewBox="0 0 468 284" role="img" aria-labelledby="fig-method-title fig-method-desc">
  <title id="fig-method-title">Method overview</title>
  <desc id="fig-method-desc">After two FedAvg SFT rounds, every round each client samples SQL from the global model, executes it on its private databases to label each sample correct or wrong, pairs correct with wrong samples, trains LoRA with DPO + NLL and returns its adapter, which the server averages into the next global model.</desc>

  <!-- style block of paper/figures/template.svg, unchanged -->
  <style>
    text { font-family: Arial, Helvetica, sans-serif; font-size: 8px; fill: #000; }
    .h { font-size: 9px; font-weight: bold; }
    .b { font-weight: bold; }
    .i { font-style: italic; }
    .sub { font-size: 6px; }
    .mid { text-anchor: middle; }
    .end { text-anchor: end; }
    .server { fill: #E2E8F0; }
    .client { fill: #F1F5F9; }
    .boundary { fill: none; stroke: #475569; stroke-width: 0.75; stroke-dasharray: 3 2; }
    .card { fill: #FFFFFF; }
    .card-line { fill: none; stroke: #94A3B8; stroke-width: 0.5; }
    .band { fill: #E2E8F0; }
    .badge { fill: #CBD5E1; }
    .accent { fill: #E4EEFD; }
    .accent-line { fill: none; stroke: #2F6FDE; stroke-width: 0.75; }
    .accent-band { fill: #DCE9FC; }
    .accent-badge { fill: #B6D0F8; }
    .chip { fill: #FFFFFF; stroke: #94A3B8; stroke-width: 0.5; }
    .chip-ok { fill: #DDF3EB; stroke: #009E73; stroke-width: 0.5; }
    .chip-bad { fill: #FBE5D8; stroke: #D55E00; stroke-width: 0.5; }
    .flow { fill: none; stroke: #334155; stroke-width: 0.75; marker-end: url(#arrow); }
    .comm { fill: none; stroke: #334155; stroke-width: 1.25; marker-end: url(#arrow-comm); }
    .icon { fill: none; stroke: #334155; stroke-width: 1; stroke-linecap: round; stroke-linejoin: round; }
    .icon .dot { fill: #FFFFFF; }
    .ok { fill: none; stroke: #009E73; stroke-width: 1.25; stroke-linecap: round; stroke-linejoin: round; }
    .bad { fill: none; stroke: #D55E00; stroke-width: 1.25; stroke-linecap: round; }
    .legend { fill: #F1F5F9; }
    .rule { stroke: #94A3B8; stroke-width: 0.5; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 6 6" refX="5.6" refY="3" markerWidth="4.5" markerHeight="4.5" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0 0.4 L6 3 L0 5.6 Z" fill="#334155"/>
    </marker>
    <marker id="arrow-comm" viewBox="0 0 6 6" refX="5.2" refY="3" markerWidth="5.5" markerHeight="5.5" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0 0.4 L6 3 L0 5.6 Z" fill="#334155"/>
    </marker>
    <g id="icon-doc" class="icon"><path d="M2 1 H8 L11 4 V13 H2 Z M8 1 V4 H11 M4.5 7 H8.5 M4.5 10 H8.5"/></g>
    <g id="icon-db" class="icon"><ellipse cx="6.5" cy="3" rx="5" ry="2"/><path d="M1.5 3 V11 A5 2 0 0 0 11.5 11 V3 M1.5 7 A5 2 0 0 0 11.5 7"/></g>
    <g id="icon-model" class="icon">
      <path d="M2 2.5 L6.5 6.5 L11 2.5 M2 10.5 L6.5 6.5 L11 10.5"/>
      <circle class="dot" cx="2" cy="2.5" r="1.6"/><circle class="dot" cx="2" cy="10.5" r="1.6"/>
      <circle class="dot" cx="11" cy="2.5" r="1.6"/><circle class="dot" cx="11" cy="10.5" r="1.6"/>
      <circle class="dot" cx="6.5" cy="6.5" r="1.9"/>
    </g>
    <path id="icon-ok" class="ok" d="M0 3.5 L2.8 6.3 L7.5 0.5"/>
    <path id="icon-bad" class="bad" d="M0.5 0.5 L6.5 6.5 M6.5 0.5 L0.5 6.5"/>
  </defs>

  <!-- stages: the second one is the round drawn below -->
  <path class="flow" d="M151 14 H171"/>
  <path class="flow" d="M351 14 H371"/>
  <rect class="client" x="1" y="1" width="150" height="26" rx="4"/>
  <text class="h" x="9" y="12">Stage 1: SFT warm-up</text>
  <text x="9" y="22">2 FedAvg rounds on gold SQL</text>
  <rect class="accent" x="171" y="1" width="180" height="26" rx="4"/>
  <text class="h" x="179" y="12">Stage 2: On-policy DPO rounds</text>
  <text x="179" y="22">Every round <tspan class="i">t</tspan>; one round is shown below</text>
  <rect class="client" x="371" y="1" width="96" height="26" rx="4"/>
  <text class="h" x="379" y="12">Deploy</text>
  <text x="379" y="22">The global model</text>

  <!-- server -->
  <rect class="server" x="1" y="44" width="466" height="24" rx="4"/>
  <text x="9" y="59"><tspan class="h">Server</tspan><tspan dx="10">FedAvg of the adapters, weighted by number of pairs → </tspan><tspan class="i">θ</tspan><tspan class="sub" dy="2">t+1</tspan></text>

  <!-- client k inside its privacy boundary -->
  <rect class="client" x="1" y="112" width="466" height="138" rx="4"/>
  <rect class="boundary" x="1" y="112" width="466" height="138" rx="4"/>
  <text class="mid" x="235" y="125"><tspan class="h">Client </tspan><tspan class="h i">k</tspan><tspan dx="6">(one of </tspan><tspan class="i">K</tspan> = 5 clients)</text>
  <text x="9" y="242"><tspan class="b">Privacy boundary:</tspan> questions, gold SQL and databases never leave the client</text>

  <!-- what travels between server and client -->
  <path class="comm" d="M61 68 V132"/>
  <path class="comm" d="M409 132 V68"/>
  <text x="68" y="93">Global model <tspan class="i">θ</tspan><tspan class="sub" dy="2">t</tspan></text>
  <text class="end" x="402" y="93">Adapter <tspan class="i">Δ</tspan><tspan class="sub" dy="2">k</tspan></text>
  <text class="mid i" x="235" y="87">Only LoRA adapters travel</text>
  <text class="mid i" x="235" y="99">Next round samples again from θ<tspan class="sub" dy="2">t+1</tspan></text>

  <!-- flow between the four steps -->
  <path class="flow" d="M113 179 H125"/>
  <path class="flow" d="M229 179 H241"/>
  <path class="flow" d="M345 179 H357"/>

  <!-- 1 sample -->
  <rect class="card" x="9" y="132" width="104" height="94" rx="4"/>
  <path class="accent-band" d="M9 150 V136 A4 4 0 0 1 13 132 H109 A4 4 0 0 1 113 136 V150 Z"/>
  <rect class="accent-line" x="9" y="132" width="104" height="94" rx="4"/>
  <circle class="accent-badge" cx="21" cy="141" r="6"/>
  <text class="b mid" x="21" y="144">1</text>
  <text class="b" x="32" y="144">Sample</text>
  <use href="#icon-model" x="17" y="172"/>
  <path class="flow" d="M33 178.5 H43"/>
  <rect class="chip" x="47" y="158" width="58" height="11" rx="2.5"/>
  <text class="mid" x="76" y="166.3">SQL 1</text>
  <rect class="chip" x="47" y="173" width="58" height="11" rx="2.5"/>
  <text class="mid" x="76" y="181.3">SQL 2</text>
  <rect class="chip" x="47" y="188" width="58" height="11" rx="2.5"/>
  <text class="mid" x="76" y="196.3">SQL 3</text>
  <text x="17" y="211"><tspan class="i">N</tspan> = 10 SQL per</text>
  <text x="17" y="221">question, from <tspan class="i">θ</tspan><tspan class="sub" dy="2">t</tspan></text>

  <!-- 2 execute -->
  <rect class="card" x="125" y="132" width="104" height="94" rx="4"/>
  <path class="accent-band" d="M125 150 V136 A4 4 0 0 1 129 132 H225 A4 4 0 0 1 229 136 V150 Z"/>
  <rect class="accent-line" x="125" y="132" width="104" height="94" rx="4"/>
  <circle class="accent-badge" cx="137" cy="141" r="6"/>
  <text class="b mid" x="137" y="144">2</text>
  <text class="b" x="148" y="144">Execute</text>
  <use href="#icon-db" x="133" y="171.5"/>
  <rect class="chip" x="153" y="158" width="48" height="11" rx="2.5"/>
  <text class="mid" x="177" y="166.3">SQL 1</text>
  <use href="#icon-ok" x="208" y="160"/>
  <rect class="chip" x="153" y="173" width="48" height="11" rx="2.5"/>
  <text class="mid" x="177" y="181.3">SQL 2</text>
  <use href="#icon-bad" x="208.5" y="175"/>
  <rect class="chip" x="153" y="188" width="48" height="11" rx="2.5"/>
  <text class="mid" x="177" y="196.3">SQL 3</text>
  <use href="#icon-bad" x="208.5" y="190"/>
  <text x="133" y="211">On private databases:</text>
  <text x="133" y="221"><tspan class="b">execution label</tspan></text>

  <!-- 3 pair -->
  <rect class="card" x="241" y="132" width="104" height="94" rx="4"/>
  <path class="accent-band" d="M241 150 V136 A4 4 0 0 1 245 132 H341 A4 4 0 0 1 345 136 V150 Z"/>
  <rect class="accent-line" x="241" y="132" width="104" height="94" rx="4"/>
  <circle class="accent-badge" cx="253" cy="141" r="6"/>
  <text class="b mid" x="253" y="144">3</text>
  <text class="b" x="264" y="144">Pair</text>
  <rect class="chip-ok" x="251" y="163" width="34" height="11" rx="2.5"/>
  <text class="mid" x="268" y="171.3">SQL 1</text>
  <text class="b mid" x="293" y="171.3">&gt;</text>
  <rect class="chip-bad" x="301" y="163" width="34" height="11" rx="2.5"/>
  <text class="mid" x="318" y="171.3">SQL 2</text>
  <rect class="chip-ok" x="251" y="181" width="34" height="11" rx="2.5"/>
  <text class="mid" x="268" y="189.3">SQL 1</text>
  <text class="b mid" x="293" y="189.3">&gt;</text>
  <rect class="chip-bad" x="301" y="181" width="34" height="11" rx="2.5"/>
  <text class="mid" x="318" y="189.3">SQL 3</text>
  <text x="249" y="211"><tspan class="b">Preference pairs:</tspan></text>
  <text x="249" y="221">correct over wrong</text>

  <!-- 4 train -->
  <rect class="card" x="357" y="132" width="104" height="94" rx="4"/>
  <path class="band" d="M357 150 V136 A4 4 0 0 1 361 132 H457 A4 4 0 0 1 461 136 V150 Z"/>
  <rect class="card-line" x="357" y="132" width="104" height="94" rx="4"/>
  <circle class="badge" cx="369" cy="141" r="6"/>
  <text class="b mid" x="369" y="144">4</text>
  <text class="b" x="380" y="144">Train</text>
  <use href="#icon-model" x="387" y="160"/>
  <text x="405" y="170">+ LoRA</text>
  <text class="mid" x="409" y="192"><tspan class="i">L</tspan> = <tspan class="i">L</tspan><tspan class="sub" dy="2">DPO</tspan><tspan dy="-2"> + </tspan><tspan class="i">L</tspan><tspan class="sub" dy="2">NLL</tspan></text>
  <text x="365" y="211"><tspan class="b">DPO + NLL</tspan> on the</text>
  <text x="365" y="221">pairs, reference = <tspan class="i">θ</tspan><tspan class="sub" dy="2">t</tspan></text>

  <!-- legend strip -->
  <rect class="legend" x="1" y="262" width="466" height="20" rx="4"/>
  <text x="9" y="275"><tspan class="b">FedAvg SFT:</tspan> learns from gold SQL only</text>
  <path class="rule" d="M176 266 V278"/>
  <text x="186" y="275"><tspan class="b">Ours:</tspan> also learns from executing its own SQL at the client</text>
</svg>
