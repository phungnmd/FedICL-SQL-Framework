<svg xmlns="http://www.w3.org/2000/svg" width="468" height="264" viewBox="0 0 468 264" role="img" aria-labelledby="fig-idea-title fig-idea-desc">
  <title id="fig-idea-title">One question, two ways of training</title>
  <desc id="fig-idea-desc">One BIRD training question of a client, on the database language_corpus. (A) FedAvg SFT trains the model on the gold SQL query as the only target; the database is not queried. (B) FedExec-SQL samples ten queries from the model, executes each on the client database and compares its result with that of the gold SQL query. The table shows the samples of the two preference pairs this question gave in the round: a correct query, one with a wrong result and one that fails; each pair is trained with DPO and NLL.</desc>

  <!-- Copy this style block and the defs into every figure, unchanged. -->
  <style>
    text { font-family: Arial, Helvetica, sans-serif; font-size: 8px; fill: #000; }
    .h { font-size: 9px; font-weight: bold; }
    .b { font-weight: bold; }
    .i { font-style: italic; }
    .sub { font-size: 6px; }
    .mid { text-anchor: middle; }
    .end { text-anchor: end; }
    .blue { fill: #E8F0FE; stroke: #2563EB; stroke-width: 0.75; }
    .method { fill: #F8EAF2; stroke: #A8528A; stroke-width: 0.75; }
    .plain { fill: #F1F5F9; stroke: #94A3B8; stroke-width: 0.5; }
    .client { fill: #FFF7E6; }
    .boundary { fill: none; stroke: #B45309; stroke-width: 0.75; stroke-dasharray: 3 2; }
    .card { fill: #FFFFFF; }
    .card-band { fill: #F1F5F9; }
    .card-line { fill: none; stroke: #94A3B8; stroke-width: 0.75; }
    .card-badge { fill: #EFD3E3; }
    .rule { fill: none; stroke: #CBD5E1; stroke-width: 0.5; }
    .chip { fill: #FFFFFF; stroke: #94A3B8; stroke-width: 0.5; }
    .chip-blue { fill: #FFFFFF; stroke: #2563EB; stroke-width: 0.5; }
    .chip-method { fill: #F8EAF2; stroke: #A8528A; stroke-width: 0.5; }
    .chip-ok { fill: #DDF3EB; stroke: #009E73; stroke-width: 0.5; }
    .chip-bad { fill: #FBE5D8; stroke: #D55E00; stroke-width: 0.5; }
    .flow { fill: none; stroke: #334155; stroke-width: 0.75; marker-end: url(#arrow); }
    .comm { fill: none; stroke: #2563EB; stroke-width: 1.25; marker-end: url(#arrow-comm); }
    .ic { stroke-width: 1; stroke-linecap: round; stroke-linejoin: round; }
    .ic-blue { stroke: #1D4ED8; fill: #C9DCFC; }
    .ic-method { stroke: #8E3F74; fill: #EFD3E3; }
    .ic-slate { stroke: #475569; fill: #E2E8F0; }
    .ic-amber { stroke: #B45309; fill: #FBDFA6; }
    .ok { fill: none; stroke: #009E73; stroke-width: 1.25; stroke-linecap: round; stroke-linejoin: round; }
    .bad { fill: none; stroke: #D55E00; stroke-width: 1.25; stroke-linecap: round; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 6 6" refX="5.6" refY="3" markerWidth="4.5" markerHeight="4.5" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0 0.4 L6 3 L0 5.6 Z" fill="#334155"/>
    </marker>
    <marker id="arrow-comm" viewBox="0 0 6 6" refX="5.2" refY="3" markerWidth="5.5" markerHeight="5.5" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0 0.4 L6 3 L0 5.6 Z" fill="#2563EB"/>
    </marker>
    <!-- two-tone icons: line and tint come from the class on <use> -->
    <g id="icon-model" class="ic">
      <path fill="none" d="M3 4 L11 11 L19 4 M3 18 L11 11 L19 18 M3 4 V18 M19 4 V18"/>
      <circle cx="3" cy="4" r="2.6"/><circle cx="3" cy="18" r="2.6"/>
      <circle cx="19" cy="4" r="2.6"/><circle cx="19" cy="18" r="2.6"/>
      <circle cx="11" cy="11" r="3.4"/>
    </g>
    <g id="icon-db" class="ic">
      <path d="M1 4 V18 A8 3 0 0 0 17 18 V4 Z"/>
      <ellipse cx="9" cy="4" rx="8" ry="3"/>
      <path fill="none" d="M1 11 A8 3 0 0 0 17 11"/>
    </g>
    <g id="icon-server" class="ic">
      <rect x="1" y="2" width="18" height="7" rx="1.5"/>
      <rect x="1" y="11" width="18" height="7" rx="1.5"/>
      <path fill="none" d="M4.5 5.5 H5 M4.5 14.5 H5 M10 5.5 H15.5 M10 14.5 H15.5"/>
    </g>
    <g id="icon-doc" class="ic">
      <path d="M1 1 H9 L13 5 V17 H1 Z"/>
      <path fill="none" d="M9 1 V5 H13 M4 9 H10 M4 12.5 H10"/>
    </g>
    <g id="icon-lock" class="ic">
      <rect x="1" y="5" width="8" height="6.5" rx="1"/>
      <path fill="none" d="M3 5 V3.5 A2 2 0 0 1 7 3.5 V5"/>
    </g>
    <path id="icon-ok" class="ok" d="M0 3.5 L2.8 6.3 L7.5 0.5"/>
    <path id="icon-bad" class="bad" d="M0.5 0.5 L6.5 6.5 M6.5 0.5 L0.5 6.5"/>
  </defs>

  <!-- client boundary: everything drawn stays at the client -->
  <rect class="client" x="1" y="1" width="466" height="262" rx="4"/>
  <rect class="boundary" x="1" y="1" width="466" height="262" rx="4"/>
  <use href="#icon-lock" class="ic-amber" x="9" y="5"/>
  <text class="h" x="23" y="14">Client <tspan class="i">k</tspan></text>

  <!-- the training example both panels use -->
  <rect class="chip" x="9" y="20" width="450" height="49" rx="2.5"/>
  <text class="b" x="15" y="31">Question</text>
  <text x="62" y="31">How many Catalan-language Wikipedia pages are there overall?</text>
  <text class="b" x="15" y="42">Evidence</text>
  <text x="62" y="42">Catalan-language refers to lang = 'ca';</text>
  <text class="b" x="15" y="53">Gold SQL</text>
  <text x="62" y="53">SELECT pages FROM langs WHERE lang = 'ca'</text>
  <text class="b" x="15" y="64">Database</text>
  <text x="62" y="64">language_corpus</text>

  <!-- A: FedAvg SFT -->
  <rect class="plain" x="9" y="77" width="450" height="34" rx="4"/>
  <text class="h" x="15" y="97">A</text>
  <text class="h" x="27" y="97">FedAvg SFT</text>
  <path class="flow" d="M134 94 H146"/>
  <path class="flow" d="M172 94 H196"/>
  <rect class="chip" x="100" y="88" width="34" height="12" rx="2.5"/>
  <text class="mid" x="117" y="96.6">Prompt</text>
  <use href="#icon-model" class="ic-slate" x="148" y="83"/>
  <text class="mid" x="184" y="90">NLL</text>
  <rect class="chip" x="198" y="88" width="42" height="12" rx="2.5"/>
  <text class="mid" x="219" y="96.6">Gold SQL</text>
  <use href="#icon-db" class="ic-amber" x="256" y="83"/>
  <text x="279" y="97">Database not queried</text>

  <!-- B: FedExec-SQL -->
  <rect class="method" x="9" y="119" width="450" height="136" rx="4"/>
  <text class="h" x="15" y="139">B</text>
  <text class="h" x="27" y="139">FedExec-SQL</text>
  <path class="flow" d="M134 139 H146"/>
  <path class="flow" d="M172 139 H184"/>
  <rect class="chip" x="100" y="133" width="34" height="12" rx="2.5"/>
  <text class="mid" x="117" y="141.6">Prompt</text>
  <use href="#icon-model" class="ic-method" x="148" y="128"/>
  <use href="#icon-db" class="ic-amber" x="186" y="128"/>
  <text x="211" y="142"><tspan class="i">N</tspan> = 10 samples of the model, executed on the client database</text>

  <text x="66" y="165">Sample</text>
  <text x="306" y="165">Result</text>
  <text x="17" y="178">Gold SQL</text>
  <text class="i" x="66" y="178">the result a sample has to match</text>
  <text x="306" y="178">1129144</text>
  <path class="rule" d="M17 183.5 H433"/>
  <text x="17" y="196.3">SQL 1</text>
  <rect class="chip-ok" x="62" y="188" width="234" height="11" rx="2.5"/>
  <text x="66" y="196.3">SELECT pages FROM langs WHERE lang = 'ca'</text>
  <text x="306" y="196.3">1129144</text>
  <use href="#icon-ok" x="424" y="190"/>
  <text x="17" y="211.3">SQL 2</text>
  <rect class="chip-bad" x="62" y="203" width="234" height="11" rx="2.5"/>
  <text x="66" y="211.3">SELECT COUNT(*) FROM langs WHERE lang = 'ca'</text>
  <text x="306" y="211.3">1</text>
  <use href="#icon-bad" x="424.5" y="205"/>
  <text x="17" y="226.3">SQL 3</text>
  <rect class="chip-bad" x="62" y="218" width="234" height="11" rx="2.5"/>
  <text x="66" y="226.3">SELECT COUNT(tid) FROM langs WHERE lang = 'ca'</text>
  <text x="306" y="226.3">Error: no such column: tid</text>
  <use href="#icon-bad" x="424.5" y="220"/>

  <text x="17" y="244.3">Pairs</text>
  <rect class="chip-ok" x="62" y="236" width="30" height="11" rx="2.5"/>
  <text class="mid" x="77" y="244.3">SQL 1</text>
  <text class="b mid" x="99" y="244.3">&gt;</text>
  <rect class="chip-bad" x="106" y="236" width="30" height="11" rx="2.5"/>
  <text class="mid" x="121" y="244.3">SQL 2</text>
  <rect class="chip-ok" x="148" y="236" width="30" height="11" rx="2.5"/>
  <text class="mid" x="163" y="244.3">SQL 1</text>
  <text class="b mid" x="185" y="244.3">&gt;</text>
  <rect class="chip-bad" x="192" y="236" width="30" height="11" rx="2.5"/>
  <text class="mid" x="207" y="244.3">SQL 3</text>
  <path class="flow" d="M224 241.5 H238"/>
  <text class="b" x="242" y="244.6">DPO + NLL</text>
</svg>
