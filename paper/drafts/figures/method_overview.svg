<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1350" viewBox="0 0 1440 810"
     role="img" aria-labelledby="method-overview-title method-overview-desc"
     font-family="Arial" font-size="23" fill="#252b31">
  <title id="method-overview-title">Federated Text-to-SQL method overview</title>
  <desc id="method-overview-desc">Five clients warm up the model with FedAvg SFT, then repeatedly sample and execute SQL locally, train LoRA on preference pairs, and return adapters for pair-weighted aggregation before the global model is deployed.</desc>

  <rect width="1440" height="810" fill="#fff"/>
  <path d="M30 68 H1410" stroke="#d1d6da" stroke-width="1.5"/>
  <text x="30" y="49" font-weight="bold">Model: Qwen2.5-Coder-1.5B + LoRA</text>
  <text x="1410" y="49" text-anchor="end" fill="#46505a">K = 5 clients (organisations)</text>

  <g font-size="25" font-weight="bold">
    <text x="30" y="106">SFT warm-up (2 FedAvg rounds)</text>
    <text x="470" y="106">On-policy DPO rounds</text>
  </g>

  <!-- Warm-up client, private workspace, and footer backgrounds. -->
  <rect x="30" y="315" width="398" height="179" rx="8" fill="#faf5ed" stroke="#ba9e7e" stroke-width="1.5"/>
  <rect x="470" y="315" width="905" height="384" rx="9" fill="#fcfaf6"
        stroke="#92775c" stroke-width="1.6" stroke-dasharray="7 5"/>
  <rect x="30" y="724" width="1380" height="57" rx="6" fill="#f2f4f5"/>
  <path d="M528 736 V769" stroke="#c3cbd0" stroke-width="1.5"/>

  <!-- Adapter traffic and the stage handoff. -->
  <g fill="none" stroke="#285685" stroke-width="2">
    <path d="M84 215 V315"/>
    <path d="M376 315 V215"/>
    <path d="M428 172 H470"/>
    <path d="M611 215 V366"/>
    <path d="M1355 608 H1390 Q1400 608 1400 598 V279 Q1400 269 1390 269 H1063 Q1053 269 1053 259 V215"/>
    <path d="M1074 172 H1128"/>
  </g>
  <path fill="#285685" d="M84 315 l-5 -10 h10 Z M376 215 l-5 10 h10 Z
                           M470 172 l-10 -5 v10 Z M611 366 l-5 -10 h10 Z
                           M1053 215 l-5 10 h10 Z M1128 172 l-10 -5 v10 Z"/>

  <!-- Numbered client pipeline, read in arrow order. -->
  <g fill="none" stroke="#646c73" stroke-width="1.8">
    <path d="M901 397 H936"/>
    <path d="M1145 428 V452"/>
    <path d="M936 502 H901"/>
    <path d="M697 552 V576"/>
    <path d="M901 608 H936"/>
  </g>
  <path fill="#646c73" d="M936 397 l-10 -5 v10 Z M1145 452 l-5 -10 h10 Z
                           M901 502 l10 -5 v10 Z M697 576 l-5 -10 h10 Z
                           M936 608 l-10 -5 v10 Z"/>

  <g fill="#edf3fa" stroke="#7892ab" stroke-width="1.5">
    <rect x="30" y="130" width="398" height="85" rx="8"/>
    <rect x="470" y="130" width="604" height="85" rx="8"/>
    <rect x="1128" y="130" width="282" height="85" rx="8"/>
  </g>
  <g fill="#285685" font-size="24" font-weight="bold">
    <text x="49" y="162">Server</text>
    <text x="490" y="162">Server</text>
    <text x="1269" y="167" text-anchor="middle">Deploy global model</text>
  </g>
  <text x="49" y="192">FedAvg averages the adapters</text>
  <g aria-label="FedAvg, weighted by number of pairs → θ_{t+1}">
    <text x="490" y="192">FedAvg, weighted by number of pairs → θ</text>
    <text x="920" y="197" font-size="21">t+1</text>
  </g>
  <text x="1269" y="195" text-anchor="middle" font-size="22" fill="#46505a">After the final round</text>

  <g fill="#46505a" font-size="22">
    <text x="99" y="257">global model</text>
    <text x="362" y="283" text-anchor="end">Client adapters</text>
    <g aria-label="next round: sample again from θ_{t+1}">
      <text x="630" y="248">next round: sample again from θ</text>
      <text x="946" y="253" font-size="21">t+1</text>
    </g>
    <text x="630" y="292">only the LoRA adapter is communicated</text>
  </g>

  <g fill="#764817" font-size="24" font-weight="bold">
    <text x="49" y="349">Clients</text>
    <text x="491" y="349">Client k</text>
  </g>
  <rect x="48" y="367" width="362" height="90" rx="6" fill="#fff" stroke="#cfbb9f" stroke-width="1.5"/>
  <text x="66" y="403">Fine-tune the model</text>
  <text x="66" y="432">on gold SQL</text>

  <!-- Four other organisations repeat the same local workflow. -->
  <text x="1267" y="298" text-anchor="end" font-size="22" fill="#46505a">4 other clients</text>
  <g fill="#faf5ed" stroke="#a88259" stroke-width="1.4">
    <rect x="1313" y="275" width="42" height="21" rx="3"/>
    <rect x="1304" y="279" width="42" height="21" rx="3"/>
    <rect x="1295" y="283" width="42" height="21" rx="3"/>
    <rect x="1286" y="287" width="42" height="21" rx="3"/>
  </g>

  <g fill="#fff" stroke="#cfbb9f" stroke-width="1.5">
    <rect x="492" y="366" width="409" height="62" rx="6"/>
    <rect x="936" y="366" width="419" height="62" rx="6"/>
    <rect x="936" y="452" width="419" height="100" rx="6"/>
    <rect x="492" y="452" width="409" height="100" rx="6"/>
    <rect x="492" y="576" width="409" height="64" rx="6"/>
    <rect x="936" y="576" width="419" height="64" rx="6"/>
  </g>

  <g fill="#764817" font-weight="bold" text-anchor="middle">
    <text x="516" y="404">1</text>
    <text x="960" y="391">2</text>
    <text x="960" y="477">3</text>
    <text x="516" y="497">4</text>
    <text x="516" y="602">5</text>
    <text x="960" y="615">6</text>
  </g>
  <g aria-label="Receive global model θ_t">
    <text x="542" y="404">Receive global model θ</text>
    <text x="782" y="409" font-size="21">t</text>
  </g>
  <g aria-label="Sample N = 10 SQL per question from θ_t">
    <text x="986" y="391">Sample N = 10 SQL per question</text>
    <text x="986" y="416">from θ</text>
    <text x="1052" y="421" font-size="21">t</text>
  </g>
  <g aria-label="Execute on private databases, compare with gold result">
    <text x="986" y="477">Execute on private databases,</text>
    <text x="986" y="502">compare with gold result</text>
  </g>
  <g aria-label="Build preference pairs (correct SQL, wrong SQL)">
    <text x="542" y="497">Build <tspan font-weight="bold">preference pairs</tspan></text>
    <text x="542" y="523">(correct SQL, wrong SQL)</text>
  </g>
  <g aria-label="Train LoRA with DPO + NLL, reference = θ_t">
    <text x="542" y="602">Train LoRA with <tspan font-weight="bold">DPO + NLL</tspan>,</text>
    <text x="542" y="627">reference = θ</text>
    <text x="679" y="632" font-size="21">t</text>
  </g>
  <g aria-label="Send adapter Δ_k">
    <text x="986" y="615">Send adapter Δ</text>
    <text x="1147" y="620" font-size="21">k</text>
  </g>

  <path d="M986 513 H1337" stroke="#e1e4e6" stroke-width="1.25"/>
  <text x="986" y="538" font-size="22">execution label</text>
  <g font-size="22" font-weight="bold">
    <path d="M1151 530 l5 5 10 -11" fill="none" stroke="#286644" stroke-width="2.7"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"/>
    <text x="1173" y="538" fill="#286644">correct</text>
    <path d="M1263 525 l11 11 M1274 525 l-11 11" fill="none" stroke="#a33346" stroke-width="2.5"
          stroke-linecap="round" aria-hidden="true"/>
    <text x="1282" y="538" fill="#a33346">wrong</text>
  </g>

  <text x="491" y="678" fill="#764817" font-size="22" font-weight="bold">privacy boundary</text>
  <text x="695" y="678" fill="#46505a" font-size="22">questions, gold SQL and databases stay at the client</text>

  <g font-size="22">
    <text x="49" y="760"><tspan font-weight="bold">FedAvg SFT:</tspan> learns from gold SQL only</text>
    <text x="551" y="760"><tspan font-weight="bold">Ours:</tspan> also learns from executing its own SQL on the client's databases</text>
  </g>
</svg>
